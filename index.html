<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retrosonic 3000</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14100b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--amber:#ffb000;--hot:#ff5a1f;--cream:#e9dcb5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(circle at 50% 0,#2a2117,#14100b 60%);color:var(--cream);font-family:'Courier New',ui-monospace,monospace;min-height:100vh;user-select:none;-webkit-user-select:none}
.wrap{max-width:480px;margin:0 auto;padding:12px}
.case{border-radius:22px;padding:0 14px;background:repeating-linear-gradient(90deg,#5a3a1f 0 3px,#6e4825 3px 6px,#4f321b 6px 9px);box-shadow:0 14px 30px #000a}
.deck{background:linear-gradient(160deg,#6b6252,#3b352b);padding:14px;border-inline:2px solid #1b160f;box-shadow:inset 0 2px 0 #fff3}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px;color:#1b160f;font-weight:700;letter-spacing:.18em;font-size:13px}
.top b{color:#7a1f0d}
.led{width:12px;height:12px;border-radius:50%;background:#3a1208;box-shadow:inset 0 1px 2px #000;transition:.3s}
.led.on{background:#ff4a1a;box-shadow:0 0 10px #ff4a1a,0 0 20px #ff4a1a88}
.tape{width:100%;aspect-ratio:480/228;display:block;border-radius:12px;box-shadow:0 4px 10px #0008}
.lcd{position:relative;margin:12px 0 8px;height:170px;border-radius:10px;background:#0b0803;border:3px solid #1b160f;box-shadow:inset 0 0 24px #000,0 1px 0 #fff3;overflow:hidden;will-change:transform}
.lcd canvas{position:absolute;inset:0;width:100%;height:100%}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0004 0 1px,transparent 1px 3px)}
.lt{position:absolute;top:6px;left:10px;right:10px;display:flex;gap:10px;justify-content:space-between;color:var(--amber);font-size:13px;text-shadow:0 0 6px #ff9000}
.mq{overflow:hidden;white-space:nowrap;flex:1}.mq span{display:inline-block}
.mq span.scroll{animation:mq 10s linear infinite}
@keyframes mq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.lb{position:absolute;bottom:6px;left:10px;right:10px;display:flex;justify-content:space-between;color:var(--amber);font-size:11px;opacity:.75;letter-spacing:.15em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:4px 0 10px;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(#0b0803,#2a2218);box-shadow:inset 0 1px 3px #000,0 1px 0 #fff3}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:30px;margin-top:-11px;border-radius:4px;background:linear-gradient(#7a1f0d,#7a1f0d) center/2px 70% no-repeat,linear-gradient(90deg,#8e8268,#e2d6bb 50%,#8e8268);box-shadow:0 3px 5px #000a}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#1d1812}
input[type=range]::-moz-range-thumb{width:20px;height:30px;border:0;border-radius:4px;background:linear-gradient(90deg,#8e8268,#e2d6bb 50%,#8e8268)}
.keys{display:flex;gap:7px;margin-bottom:14px}
.key,.tg{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
.key{flex:1;height:62px;border-radius:7px;background:linear-gradient(#e2d6bb,#a99c80);color:#2a2218;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 #4a4133,0 9px 10px #0008,inset 0 1px 0 #fff8;transition:transform .06s,box-shadow .06s}
.key i{font-style:normal;font-size:20px;line-height:1}.key small{font-size:8.5px;letter-spacing:.08em;font-weight:700}
.key:active,.key.down{transform:translateY(5px);box-shadow:0 1px 0 #4a4133,0 2px 4px #0008,inset 0 1px 0 #fff4}
.key.down{background:linear-gradient(#cdbf9f,#8f8267)}
.tgs{display:flex;gap:7px;margin-bottom:12px}
.tg{flex:1;padding:10px 6px;border-radius:5px;background:#2a241b;color:#b8a98a;font-size:10.5px;letter-spacing:.08em;box-shadow:inset 0 1px 3px #000;display:flex;justify-content:center;align-items:center;gap:7px}
.tg:after{content:'';width:8px;height:8px;border-radius:50%;background:#3a2a10}
.tg.on{color:var(--amber)}.tg.on:after{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.knobs{display:flex;justify-content:space-between}
.kn{display:flex;flex-direction:column;align-items:center;font-size:10px;letter-spacing:.1em;color:#1b160f;font-weight:700;gap:2px}
.kw{position:relative;width:78px;height:78px;display:grid;place-items:center}
.kw:before{content:'';position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -135deg,#1b160f 0 2.2deg,transparent 2.2deg 27deg);-webkit-mask:conic-gradient(from -135deg,#000 270deg,transparent 0);mask:conic-gradient(from -135deg,#000 270deg,transparent 0)}
.knob{width:58px;height:58px;border-radius:50%;background:conic-gradient(#d8cdb2,#8e8268,#d8cdb2,#8e8268,#d8cdb2);box-shadow:0 5px 8px #0009,inset 0 0 0 4px #2a241b;position:relative;touch-action:none;cursor:ns-resize;transform:rotate(var(--a,0deg));transition:transform .07s linear}
.knob:after{content:'';position:absolute;left:50%;top:5px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:#7a1f0d}
.kn b{font-size:10px;color:#3a2a10;min-height:12px}
.grille{height:30px;margin-top:10px;border-radius:8px;background:radial-gradient(#0b0a07 38%,transparent 42%) 0 0/8px 8px,#2a241b;box-shadow:inset 0 2px 6px #000}
.lib{position:fixed;inset:0;z-index:20;background:#0a0704f2;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.libp{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;color:var(--amber);text-shadow:0 0 6px #ff900088;position:relative}
.libp:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0005 0 1px,transparent 1px 3px)}
.libh{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:2px solid #6b4a10;letter-spacing:.25em;font-size:14px}
.lbtn{font:inherit;background:transparent;color:var(--amber);border:1px solid #6b4a10;border-radius:4px;padding:8px 12px;font-size:12px;cursor:pointer;letter-spacing:.1em}
.lbtn:active{background:var(--amber);color:#000}
#lGrid{flex:1;overflow-y:auto;padding:8px 0}
.cas{display:flex;align-items:center;gap:10px;padding:11px 8px;border:1px solid #3a2a10;border-radius:6px;margin-bottom:8px;cursor:pointer;background:#120d06}
.cas.cur{border-color:var(--amber);background:#2a1c06}
.cas .rl{letter-spacing:-2px;font-size:20px}
.cas .cn{flex:1;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cas .cz{font-size:10px;opacity:.6}
.cas .lbtn{padding:6px 8px;font-size:10px}
.libf{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-top:2px solid #6b4a10;font-size:11px;gap:8px}
.emp{opacity:.7;font-size:13px;line-height:1.7;padding:30px 10px;text-align:center}
</style>
</head>
<body>
<div class="wrap"><div class="case"><div class="deck">
 <div class="top"><span>RETRO<b>SONIC</b> 3000</span><span class="led" id="led"></span></div>
 <canvas class="tape" id="tape"></canvas>
 <div class="lcd" id="lcd">
  <canvas id="cv"></canvas>
  <div class="lt"><div class="mq"><span id="tt">NO TAPE · PRESS EJECT</span></div><div id="tm">00:00</div></div>
  <div class="lb"><span id="vm">SPECTRUM</span><span id="st">STOP</span><span id="cn">--/--</span></div>
  <div class="scan"></div>
 </div>
 <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
 <div class="keys">
  <button class="key" id="kPrev"><i>⏮</i><small>PREV</small></button>
  <button class="key" id="kPlay"><i>▶</i><small>PLAY</small></button>
  <button class="key" id="kPause"><i>❚❚</i><small>PAUSE</small></button>
  <button class="key" id="kStop"><i>■</i><small>STOP</small></button>
  <button class="key" id="kNext"><i>⏭</i><small>NEXT</small></button>
  <button class="key" id="kEject"><i>⏏</i><small>EJECT</small></button>
 </div>
 <div class="tgs"><button class="tg" id="tShuf">SHUFFLE</button><button class="tg" id="tRep">REPEAT</button><button class="tg" id="tViz">VISUAL</button></div>
 <div class="knobs">
  <div class="kn"><div class="kw"><div class="knob" id="kVol"></div></div>VOLUME<b id="rVol"></b></div>
  <div class="kn"><div class="kw"><div class="knob" id="kBass"></div></div>BASS<b id="rBass"></b></div>
  <div class="kn"><div class="kw"><div class="knob" id="kMid"></div></div>MIDS<b id="rMid"></b></div>
  <div class="kn"><div class="kw"><div class="knob" id="kTre"></div></div>TREBLE<b id="rTre"></b></div>
 </div>
 <div class="grille"></div>
</div></div></div>

<div class="lib" id="lib" hidden><div class="libp">
 <div class="libh"><span>▌TAPE LIBRARY</span><button class="lbtn" id="lClose">✕ CLOSE</button></div>
 <div id="lGrid"></div>
 <div class="libf"><span id="lInfo"></span><button class="lbtn" id="lAdd">＋ ADD TAPES</button></div>
</div></div>
<input id="file" type="file" accept="audio/*" multiple hidden>

<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const num=(k,d)=>{const v=store.get(k);return v===null||v===''?d:+v};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const K=(r,dt)=>1-Math.pow(1-r,dt*60);
const fmt=s=>isFinite(s)?String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0'):'00:00';
const MODES=['SPECTRUM','WAVE','CIRCLE'];
let tracks=[],idx=-1,shuffle=false,repeat=false,mode=num('rs-mode',0),vol=num('rs-vol',.85),eq={bass:num('rs-bass2',.5),mid:num('rs-mid',.5),tre:num('rs-tre',.5)};
const audio=new Audio();audio.preload='metadata';
let actx,an,gainN,F={},fd,td,nbuf,curURL;

/* audio engine */
function ensureCtx(){
 if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();
  nbuf=actx.createBuffer(1,actx.sampleRate*.1,actx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 if(actx.state==='suspended')actx.resume();return actx;
}
function setupAudio(){
 if(an)return;ensureCtx();
 const src=actx.createMediaElementSource(audio);
 const mk=(type,f,g,q)=>{const b=actx.createBiquadFilter();b.type=type;b.frequency.value=f;b.gain.value=g;if(q)b.Q.value=q;return b};
 F.bass=mk('lowshelf',160,(eq.bass-.5)*24);F.mid=mk('peaking',1000,(eq.mid-.5)*24,.7);F.tre=mk('highshelf',4500,(eq.tre-.5)*24);
 const lim=actx.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=14;lim.ratio.value=5;
 an=actx.createAnalyser();an.fftSize=2048;an.minDecibels=-88;an.maxDecibels=-18;an.smoothingTimeConstant=.6;
 gainN=actx.createGain();gainN.gain.value=vol*vol;
 src.connect(F.bass);F.bass.connect(F.mid);F.mid.connect(F.tre);F.tre.connect(lim);lim.connect(an);an.connect(gainN);gainN.connect(actx.destination);
 fd=new Uint8Array(an.frequencyBinCount);td=new Uint8Array(an.fftSize);
}
/* retro sounds */
function burst(t,f,q,g,dur,hp){
 const s=actx.createBufferSource();s.buffer=nbuf;const b=actx.createBiquadFilter();b.type=hp?'highpass':'bandpass';b.frequency.value=f;b.Q.value=q;
 const v=actx.createGain();v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.002);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(b);b.connect(v);v.connect(actx.destination);s.start(t,Math.random()*.05,dur+.02);
}
function tone(t,f0,f1,g,dur,type){
 const o=actx.createOscillator(),v=actx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.002);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(actx.destination);o.start(t);o.stop(t+dur+.02);
}
function clk(down){
 if(!actx||actx.state!=='running')return;const t=actx.currentTime;
 if(down){burst(t,2200,1.4,.5,.035);burst(t+.004,900,2,.35,.05);tone(t,170,60,.55,.09);tone(t,640,420,.08,.02,'triangle')}
 else{burst(t,3400,1.6,.28,.025);tone(t,120,70,.2,.05)}
}
function tick(v){
 if(!actx||actx.state!=='running')return;const t=actx.currentTime;
 burst(t,3000+v*1500,.8,.12,.014,true);tone(t,900+v*500,500+v*200,.05,.012);
}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.key,.tg,.lbtn'))clk(true)});
document.addEventListener('pointerup',e=>{if(e.target.closest('.key,.tg,.lbtn')){ensureCtx();clk(false)}});

/* library (IndexedDB, permanent) */
let db=null;
const dbOpen=()=>new Promise((ok,no)=>{const r=indexedDB.open('retrosonic',1);r.onupgradeneeded=()=>r.result.createObjectStore('tapes',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const dbDo=(mode,fn)=>new Promise((ok,no)=>{const t=db.transaction('tapes',mode),r=fn(t.objectStore('tapes'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});
async function loadLib(){
 try{db=await dbOpen();tracks=(await dbDo('readonly',s=>s.getAll())||[]);tracks.sort((a,b)=>a.id-b.id);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 }catch(e){db=null;info('STORAGE UNAVAILABLE - TAPES LAST UNTIL CLOSED')}
 renderLib();ui();
}
function info(m){$('lInfo').textContent=m}
function renderLib(){
 const g=$('lGrid');g.innerHTML='';
 if(!tracks.length){g.innerHTML='<div class="emp">NO TAPES LOADED<br>PRESS ＋ ADD TAPES ONCE<br>THEY STAY HERE PERMANENTLY</div>'}
 tracks.forEach((t,i)=>{
  const r=document.createElement('div');r.className='cas'+(i===idx?' cur':'');
  r.innerHTML='<span class="rl">◎◎</span><span class="cn"></span><span class="cz"></span><button class="lbtn">✕</button>';
  r.querySelector('.cn').textContent=t.name;r.querySelector('.cz').textContent=(t.size/1048576).toFixed(1)+'MB';
  r.onclick=()=>{play(i);closeLib()};
  const x=r.querySelector('button');
  x.onclick=e=>{e.stopPropagation();if(x.dataset.arm){del(i)}else{x.dataset.arm=1;x.textContent='SURE?';setTimeout(()=>{x.dataset.arm='';x.textContent='✕'},2500)}};
  g.appendChild(r);
 });
 const tot=tracks.reduce((a,t)=>a+t.size,0);info(tracks.length+' TAPES · '+(tot/1048576).toFixed(0)+'MB');
}
async function del(i){
 const t=tracks[i];try{if(db)await dbDo('readwrite',s=>s.delete(t.id))}catch(e){}
 tracks.splice(i,1);
 if(i===idx){audio.pause();audio.removeAttribute('src');idx=-1;setTitle('NO TAPE · PRESS EJECT')}else if(i<idx)idx--;
 renderLib();ui();
}
$('file').onchange=async e=>{
 const first=tracks.length;let saved=true;
 for(const f of e.target.files){
  const rec={name:f.name.replace(/\.[^.]+$/,''),size:f.size,blob:f};
  try{if(!db)throw 0;rec.id=await dbDo('readwrite',s=>s.add(rec))}catch(er){saved=false;rec.id=Date.now()+Math.random()}
  tracks.push(rec);
 }
 e.target.value='';renderLib();if(!saved)info('COULD NOT SAVE - TAPES LAST UNTIL CLOSED');
 if(idx<0&&tracks.length>first){play(first);closeLib()}
};
const openLib=()=>{$('lib').hidden=false;renderLib()},closeLib=()=>{$('lib').hidden=true};
$('lAdd').onclick=()=>$('file').click();$('lClose').onclick=closeLib;$('kEject').onclick=openLib;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLib()});

/* transport */
function ui(){
 const p=!audio.paused&&idx>=0;
 $('kPlay').classList.toggle('down',p);
 $('kPause').classList.toggle('down',!p&&idx>=0&&audio.currentTime>0);
 $('led').classList.toggle('on',p);
 $('st').textContent=idx<0?'STOP':p?'PLAY ▶':audio.currentTime>0?'PAUSE':'STOP';
 $('cn').textContent=idx<0?'--/--':String(idx+1).padStart(2,'0')+'/'+String(tracks.length).padStart(2,'0');
}
function setTitle(t){const s=$('tt');s.textContent=t;s.classList.remove('scroll');requestAnimationFrame(()=>s.classList.toggle('scroll',s.offsetWidth>s.parentElement.clientWidth))}
function play(i){
 if(i<0||i>=tracks.length)return;
 setupAudio();ensureCtx();
 if(curURL)URL.revokeObjectURL(curURL);curURL=URL.createObjectURL(tracks[i].blob);
 idx=i;audio.src=curURL;audio.play().catch(()=>{});
 setTitle(tracks[i].name.toUpperCase());
 if('mediaSession'in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:tracks[i].name,artist:'Retrosonic 3000'})}catch(e){}}
 renderLib();ui();
}
function nxt(){if(!tracks.length)return;play(shuffle?Math.floor(Math.random()*tracks.length):(idx+1)%tracks.length)}
function prv(){if(!tracks.length)return;if(audio.currentTime>3){audio.currentTime=0;return}play((idx-1+tracks.length)%tracks.length)}
function stop(){if(idx<0)return;audio.pause();audio.currentTime=0;$('seek').value=0;$('tm').textContent='00:00';ui()}
function resume(){
 if(idx<0){tracks.length?play(0):openLib();return}
 setupAudio();ensureCtx();audio.play();
}
$('kPlay').onclick=resume;$('kPause').onclick=()=>{if(idx>=0){audio.pause();ui()}};
$('kStop').onclick=stop;$('kNext').onclick=nxt;$('kPrev').onclick=prv;
$('tShuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('tRep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat)};
function setMode(m){mode=m%3;$('vm').textContent=MODES[mode];$('tViz').classList.add('on');store.set('rs-mode',mode)}
$('tViz').onclick=()=>setMode(mode+1);setMode(mode);
let drag=false;
$('seek').oninput=()=>{drag=true;if(audio.duration)$('tm').textContent=fmt($('seek').value/1000*audio.duration)};
$('seek').onchange=()=>{if(audio.duration)audio.currentTime=$('seek').value/1000*audio.duration;drag=false};
audio.onplay=ui;audio.onpause=ui;
audio.onended=()=>{if(repeat)play(idx);else if(shuffle||idx<tracks.length-1)nxt();else stop()};
audio.ontimeupdate=()=>{if(!drag&&audio.duration){$('seek').value=audio.currentTime/audio.duration*1000;$('tm').textContent=fmt(audio.currentTime)+'/'+fmt(audio.duration)}};
if('mediaSession'in navigator){try{
 navigator.mediaSession.setActionHandler('play',resume);navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
 navigator.mediaSession.setActionHandler('nexttrack',nxt);navigator.mediaSession.setActionHandler('previoustrack',prv);
}catch(e){}}

/* knobs */
function knob(el,out,get,set,txt){
 const show=()=>{el.style.setProperty('--a',(-135+get()*270)+'deg');$(out).textContent=txt(get())};
 let y0,v0,last;
 el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);ensureCtx();y0=e.clientY;v0=get();last=Math.round(v0*24)};
 el.onpointermove=e=>{
  if(!el.hasPointerCapture(e.pointerId))return;
  const v=clamp(v0+(y0-e.clientY)/150);set(v);show();
  const s=Math.round(v*24);if(s!==last){last=s;tick(v)}
 };
 show();
}
const db2=v=>{const d=Math.round((v-.5)*24);return(d>0?'+':'')+d+'dB'};
const sm_=(p,v)=>{if(an)p.setTargetAtTime(v,actx.currentTime,.05)};
knob($('kVol'),'rVol',()=>vol,v=>{vol=v;sm_(gainN&&gainN.gain,v*v);store.set('rs-vol',v)},v=>Math.round(v*100)+'%');
knob($('kBass'),'rBass',()=>eq.bass,v=>{eq.bass=v;sm_(F.bass&&F.bass.gain,(v-.5)*24);store.set('rs-bass2',v)},db2);
knob($('kMid'),'rMid',()=>eq.mid,v=>{eq.mid=v;sm_(F.mid&&F.mid.gain,(v-.5)*24);store.set('rs-mid',v)},db2);
knob($('kTre'),'rTre',()=>eq.tre,v=>{eq.tre=v;sm_(F.tre&&F.tre.gain,(v-.5)*24);store.set('rs-tre',v)},db2);

/* visuals */
function fit(c){const d=Math.min(window.devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}return[d,w,h]}
const cv=$('cv'),c=cv.getContext('2d'),tp=$('tape'),t=tp.getContext('2d');
const N=48,SEG=18,P=100,M=120;
const sm=new Float32Array(N),ds=new Float32Array(N),pk=new Float32Array(N),ww=new Float32Array(P),gw=new Float32Array(P);
let bassEnv=0,slow=0,pulse=0,rot=0,spd=0,ang=0,lastScale=1;
function rr(x,y,w,h,r){t.beginPath();t.roundRect?t.roundRect(x,y,w,h,r):t.rect(x,y,w,h)}
function drawTape(dt,live){
 const[d,w,h]=fit(tp);t.setTransform(d*w/480,0,0,d*h/228,0,0);
 spd+=((live?4.2:0)-spd)*(1-Math.exp(-dt*2.5));ang+=spd*dt;
 const prog=audio.duration?audio.currentTime/audio.duration:0;
 t.clearRect(0,0,480,228);
 rr(0,0,480,228,16);t.fillStyle='#1d1812';t.fill();
 rr(22,14,436,116,8);t.fillStyle='#e9dcb5';t.fill();
 t.fillStyle='#c4452d';t.fillRect(22,14,436,24);
 t.fillStyle='#fff';t.font='bold 13px Courier New,monospace';t.textAlign='left';t.fillText('SIDE A  ·  C-60  ·  HI-FI',34,31);
 t.fillStyle='#2a2218';t.font='italic 21px Courier New,monospace';t.textAlign='center';
 let full=idx>=0&&tracks[idx]?tracks[idx].name:'NO TAPE',nm=full;while(t.measureText(nm).width>390&&nm.length>3)nm=nm.slice(0,-2);
 t.fillText(nm!==full?nm+'…':nm,240,86);
 t.fillStyle='#b9a97b';t.fillRect(50,100,380,2);t.fillRect(50,110,380,2);
 rr(110,140,260,72,36);t.fillStyle='#0d0a07';t.fill();t.strokeStyle='#4a3e2e';t.lineWidth=3;t.stroke();
 const rl=16+(1-prog)*18,rrr=16+prog*18;
 t.strokeStyle='#3b2a1c';t.lineWidth=2;t.beginPath();t.moveTo(175,176+rl-1);t.lineTo(305,176+rrr-1);t.stroke();
 [[175,rl],[305,rrr]].forEach(([x,r])=>{
  t.beginPath();t.arc(x,176,r,0,7);t.fillStyle='#3b2a1c';t.fill();
  t.save();t.translate(x,176);t.rotate(ang);t.beginPath();t.arc(0,0,14,0,7);t.fillStyle='#d9d2c0';t.fill();t.fillStyle='#1d1812';
  for(let k=0;k<6;k++){t.rotate(Math.PI/3);t.fillRect(-2,-13,4,7)}
  t.beginPath();t.arc(0,0,5,0,7);t.fillStyle='#0d0a07';t.fill();t.restore();
 });
 [[14,14],[466,14],[14,214],[466,214]].forEach(([x,y])=>{t.beginPath();t.arc(x,y,5,0,7);t.fillStyle='#8a806b';t.fill();t.strokeStyle='#2a2218';t.lineWidth=1.5;t.beginPath();t.moveTo(x-3,y-3);t.lineTo(x+3,y+3);t.stroke()});
}
function smoothPath(pts,close){
 const n=pts.length;c.beginPath();
 if(close)c.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);else c.moveTo(pts[0][0],pts[0][1]);
 for(let i=0;i<(close?n:n-1);i++){const a=pts[i],b=pts[(i+1)%n];
  if(!close&&i===n-2)c.quadraticCurveTo(a[0],a[1],b[0],b[1]);else c.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
 if(close)c.closePath();
}
function drawViz(dt,live){
 const[d,w,h]=fit(cv);c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);
 const bh=live?actx.sampleRate/2/fd.length:1;
 for(let i=0;i<N;i++){
  let tg=0;
  if(live){
   const f0=30*Math.pow(530,i/N),f1=30*Math.pow(530,(i+1)/N),b0=Math.floor(f0/bh),b1=Math.max(b0+1,Math.ceil(f1/bh));let m=0;
   for(let b=b0;b<b1&&b<fd.length;b++)if(fd[b]>m)m=fd[b];
   tg=clamp(Math.pow(m/255,1.5)*(0.9+0.7*i/N));
  }
  sm[i]+=(tg-sm[i])*K(tg>sm[i]?.42:.06,dt);
 }
 for(let i=0;i<N;i++){ds[i]=(sm[Math.max(0,i-1)]+2*sm[i]+sm[Math.min(N-1,i+1)])/4;pk[i]=Math.max(ds[i],pk[i]-dt*.35)}
 let raw=0;if(live){for(let b=1;b<=7;b++)raw+=fd[b];raw=raw/7/255}
 bassEnv+=(raw-bassEnv)*K(raw>bassEnv?.6:.08,dt);slow+=(raw-slow)*K(.04,dt);
 const kick=raw-slow;if(live&&kick>.07)pulse=Math.min(1,Math.max(pulse,kick*3.5));pulse*=Math.pow(.02,dt);
 const sc=1+pulse*.014+bassEnv*.006;
 if(Math.abs(sc-lastScale)>.0004){$('lcd').style.transform='scale('+sc.toFixed(4)+')';lastScale=sc}
 if(mode===0){
  const bw=w/N,sh=(h-44)/SEG;
  for(let i=0;i<N;i++){
   const lit=ds[i]*SEG;
   for(let s=0;s<SEG;s++){
    const a=clamp(lit-s);if(a<=0)continue;
    c.fillStyle=s>14?'#ff4a1a':s>10?'#ff8a00':'#ffb000';c.globalAlpha=.2+.8*a;
    c.fillRect(i*bw+1.5,h-8-(s+1)*sh+1.5,bw-3,sh-3);
   }
   const ps=Math.min(SEG-1,Math.floor(pk[i]*SEG));c.globalAlpha=.85;c.fillStyle='#ffe2a0';c.fillRect(i*bw+1.5,h-8-(ps+1)*sh+1.5,bw-3,sh-3);
  }
  c.globalAlpha=1;
 }else if(mode===1){
  let st=0;
  if(live){an.getByteTimeDomainData(td);for(let s=0;s<1024;s++)if(td[s]<128&&td[s+1]>=128){st=s;break}}
  for(let i=0;i<P;i++){
   const tg=live?clamp((td[st+Math.floor(i*1024/P)]-128)/128*1.8,-1,1):0;
   ww[i]+=(tg-ww[i])*K(.22,dt);gw[i]+=(ww[i]-gw[i])*K(.06,dt);
  }
  const pts=a=>Array.from(a,(v,i)=>[i/(P-1)*w,h/2+v*h*.38]);
  c.lineJoin='round';c.strokeStyle='#ff8a00';c.lineWidth=7;c.globalAlpha=.25;smoothPath(pts(gw));c.stroke();
  c.globalAlpha=1;c.strokeStyle='#ffb000';c.lineWidth=3;c.shadowColor='#ff9000';c.shadowBlur=10;smoothPath(pts(ww));c.stroke();c.shadowBlur=0;
 }else{
  rot+=dt*(.1+bassEnv*.4);
  const cx=w/2,cy=h/2+4,mn=Math.min(w,h),R=mn*.25*(1+bassEnv*.2+pulse*.22),pts=[];
  for(let j=0;j<M;j++){
   const k=j<M/2?j:M-1-j,f=k/(M/2-1)*(N-1),a=Math.floor(f),b=Math.min(N-1,a+1),v=ds[a]+(ds[b]-ds[a])*(f-a);
   const th=j/M*Math.PI*2-Math.PI/2+rot,r=R+v*mn*.26;pts.push([cx+Math.cos(th)*r,cy+Math.sin(th)*r]);
  }
  const g=c.createRadialGradient(cx,cy,R*.4,cx,cy,R*1.9);g.addColorStop(0,'rgba(255,138,0,.05)');g.addColorStop(1,'rgba(255,176,0,.45)');
  smoothPath(pts,true);c.fillStyle=g;c.fill();c.strokeStyle='#ffb000';c.lineWidth=2.5;c.shadowColor='#ff9000';c.shadowBlur=10;c.stroke();c.shadowBlur=0;
  c.beginPath();c.arc(cx,cy,R*(.82+bassEnv*.1),0,7);c.strokeStyle='rgba(255,176,0,.5)';c.lineWidth=2;c.stroke();
  c.beginPath();c.arc(cx,cy,R*(1.05+(1-pulse)*.35),0,7);c.globalAlpha=pulse*.6;c.strokeStyle='#ffe2a0';c.stroke();c.globalAlpha=1;
  c.beginPath();c.arc(cx,cy,R*.22*(1+pulse*.5),0,7);c.fillStyle='rgba(255,176,0,'+(.25+bassEnv*.6)+')';c.fill();
 }
}
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min((now-last)/1000,.05);last=now;
 const live=!!an&&!audio.paused;if(live)an.getByteFrequencyData(fd);
 drawViz(dt,live);drawTape(dt,live);
}
requestAnimationFrame(frame);
loadLib();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
